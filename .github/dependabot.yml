version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["tipo:manutenção", "área:infra"]
    groups:
      dependencias:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["tipo:manutenção", "área:infra"]
