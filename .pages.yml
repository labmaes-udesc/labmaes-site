media:
- name: images
  label: Imagens
  input: src/assets/uploads/images
  output: /assets/uploads/images
  categories:
  - image
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - avif
  rename: safe
- name: documents
  label: Documentos
  input: src/assets/uploads/documents
  output: /assets/uploads/documents
  categories:
  - document
  extensions:
  - pdf
  - doc
  - docx
  - odt
  - xls
  - xlsx
  - ods
  - ppt
  - pptx
  rename: safe
settings:
  commit:
    identity: user
    templates:
      create: 'content(create): {path}'
      update: 'content(update): {path}'
      delete: 'content(delete): {path}'
      rename: 'content(rename): {oldPath} -> {newPath}'
  content:
    merge: true
components:
  editorial_status:
    type: select
    label: Status editorial
    required: true
    options:
      values:
      - name: draft
        label: Rascunho
      - name: review
        label: Em revisão
      - name: published
        label: Publicado
  seo:
    type: object
    label: SEO e compartilhamento
    fields:
    - name: title
      label: Título para buscadores
      type: string
      description: Opcional. Se vazio, será usado o título principal.
    - name: description
      label: Descrição para buscadores
      type: text
      options:
        maxlength: 180
    - name: ogImage
      label: Imagem de compartilhamento
      type: image
      options:
        media: images
    - name: ogImageAlt
      label: Texto alternativo da imagem de compartilhamento
      type: string
  translations_longform:
    type: object
    label: Traduções
    description: Preencher somente quando a tradução estiver efetivamente revisada.
    fields:
    - name: en
      label: English
      type: object
      fields:
      - name: title
        label: Title
        type: string
      - name: summary
        label: Summary
        type: text
      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown
          media: images
          rename: safe
    - name: es
      label: Español
      type: object
      fields:
      - name: title
        label: Título
        type: string
      - name: summary
        label: Resumen
        type: text
      - name: body
        label: Contenido
        type: rich-text
        options:
          format: markdown
          media: images
          rename: safe
    - name: fr
      label: Français
      type: object
      fields:
      - name: title
        label: Titre
        type: string
      - name: summary
        label: Résumé
        type: text
      - name: body
        label: Contenu
        type: rich-text
        options:
          format: markdown
          media: images
          rename: safe
  translations_short:
    type: object
    label: Traduções
    description: Traduções de apresentação; títulos oficiais de obras não precisam ser traduzidos.
    fields:
    - name: en
      label: English
      type: object
      fields:
      - name: summary
        label: Summary
        type: text
    - name: es
      label: Español
      type: object
      fields:
      - name: summary
        label: Resumen
        type: text
    - name: fr
      label: Français
      type: object
      fields:
      - name: summary
        label: Résumé
        type: text
content:
- name: institutional
  label: Institucional
  type: group
  items:
  - name: pages
    label: Páginas
    type: collection
    path: src/content/pages
    format: yaml-frontmatter
    filename:
      template: '{fields.slug}.md'
      field: false
    view:
      fields:
      - title
      - editorialStatus
      primary: title
      sort:
      - title
      - editorialStatus
      search:
      - title
      - summary
    fields:
    - name: slug
      label: Slug
      type: string
      required: true
      pattern:
        regex: ^[a-z0-9-]+$
        message: Use apenas letras minúsculas, números e hífens.
      description: Identificador estável usado em URLs e relações. Use minúsculas, números e hífens; não altere depois de publicado.
    - name: editorialStatus
      component: editorial_status
    - name: title
      label: Título
      type: string
      required: true
    - name: summary
      label: Resumo
      type: text
      required: true
    - name: body
      label: Conteúdo
      type: rich-text
      required: true
      options:
        format: markdown
        media: images
        rename: safe
    - name: translations
      component: translations_longform
    - name: seo
      component: seo
    operations:
      create: true
      rename: false
      delete: false
  - name: news
    label: Notícias
    type: collection
    path: src/content/news
    format: yaml-frontmatter
    filename:
      template: '{fields.date}-{fields.slug}.md'
      field: false
    view:
      fields:
      - title
      - date
      - editorialStatus
      primary: title
      sort:
      - date
      - title
      - editorialStatus
      search:
      - title
      - summary
      default:
        sort: date
        order: desc
    fields:
    - name: slug
      label: Slug
      type: string
      required: true
      pattern: ^[a-z0-9-]+$
      description: Identificador estável usado em URLs e relações. Use minúsculas, números e hífens; não altere depois de publicado.
    - name: editorialStatus
      component: editorial_status
    - name: title
      label: Título
      type: string
      required: true
    - name: date
      label: Data
      type: date
      required: true
    - name: summary
      label: Resumo
      type: text
      required: true
    - name: cover
      label: Imagem de capa
      type: image
      options:
        media: images
    - name: coverAlt
      label: Texto alternativo da imagem de capa
      type: string
      description: Descreva a informação relevante da imagem. Se for puramente decorativa, registre isso na revisão editorial.
    - name: body
      label: Conteúdo
      type: rich-text
      required: true
      options:
        format: markdown
        media: images
        rename: safe
    - name: relatedPeople
      label: Pessoas relacionadas
      type: reference
      options:
        collection: people
        multiple: true
        search: name,preferredName
        value: '{slug}'
        label: '{name}'
    - name: relatedProjects
      label: Projetos relacionados
      type: reference
      options:
        collection: projects
        multiple: true
        search: title,acronym
        value: '{slug}'
        label: '{title}'
    - name: translations
      component: translations_longform
    - name: seo
      component: seo
    operations:
      create: true
      rename: false
      delete: false
