      label: Início
      type: date
      default: ''
    - name: endDate
      label: Término
      type: date
      default: ''
    - name: format
      label: Formato
      type: select
      options:
        values:
        - name: in-person
          label: Presencial
        - name: online
          label: Online
        - name: hybrid
          label: Híbrido
    - name: status
      label: Situação
      type: select
      required: true
      options:
        values:
        - name: planned
          label: Planejada
        - name: current
          label: Atual
        - name: archived
          label: Arquivada
    - name: summary
      label: Resumo
      type: text
    - name: organizers
      label: Organização
      type: reference
      options:
        collection: people
        multiple: true
        search: name,preferredName
        value: '{slug}'
        label: '{name}'
    - name: institutions
      label: Instituições relacionadas
      type: reference
      options:
        collection: institutions
        multiple: true
        search: name,shortName
        value: '{slug}'
        label: '{name}'
    - name: translations
      component: translations_longform
    - name: seo
      component: seo
    operations:
      create: true
      rename: false
      delete: false
